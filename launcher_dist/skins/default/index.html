<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>나만의리니지</title>
<style>
:root{--bg:#120e0b;--panel:#1c1612;--line:#3d3127;--text:#f1e7da;--muted:#a5937f;--gold:#d8a948;--gold2:#f0c86a;--red:#d65a4b;--green:#62c07f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:760px;height:500px;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.5 "Malgun Gothic","맑은 고딕",sans-serif;user-select:none}
body{background:radial-gradient(ellipse at 30% 0%,#3a2716 0%,transparent 60%),radial-gradient(ellipse at 100% 100%,#24170e 0%,transparent 55%),var(--bg);border:1px solid #4a3a2c}
.bar{height:38px;display:flex;align-items:center;padding:0 8px 0 16px;cursor:move}
.bar .t{color:var(--muted);font-size:12px;letter-spacing:1px}
.bar .x{margin-left:auto;width:32px;height:28px;border:none;background:none;color:var(--muted);font-size:18px;cursor:pointer;border-radius:4px}
.bar .x:hover{background:#3a2a20;color:var(--text)}
.wrap{display:grid;grid-template-columns:1fr 300px;gap:22px;padding:6px 26px 0}
.logo{padding-top:30px}
.logo h1{font-size:44px;font-weight:800;letter-spacing:2px;background:linear-gradient(180deg,var(--gold2),#a87428);-webkit-background-clip:text;color:transparent;text-shadow:0 2px 18px rgba(216,169,72,.15)}
.logo p{color:var(--muted);margin-top:6px}
.tips{margin-top:42px;color:var(--muted);font-size:12.5px;line-height:1.9}
.tips b{color:var(--text);font-weight:600}
.card{background:rgba(28,22,18,.92);border:1px solid var(--line);border-radius:10px;padding:16px}
.srv{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--gold);border-radius:8px;background:#241b14}
.dot{width:10px;height:10px;border-radius:50%;background:#666;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.04)}
.dot.on{background:var(--green);box-shadow:0 0 10px var(--green)}.dot.off{background:var(--red)}
.srv .n{font-weight:700;font-size:15px}.srv .s{margin-left:auto;font-size:12px;color:var(--muted)}
label.h{display:block;color:var(--muted);font-size:12px;margin:16px 0 6px}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sizes button{background:#221a14;border:1px solid var(--line);color:var(--text);padding:8px 0;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
.sizes button.on{border-color:var(--gold);color:var(--gold2);background:#2c2117}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer;color:var(--muted);font-size:13px}
.chk input{accent-color:var(--gold);width:15px;height:15px}
.go{width:100%;margin-top:18px;padding:14px 0;border:none;border-radius:8px;cursor:pointer;font:inherit;font-size:18px;font-weight:800;letter-spacing:4px;color:#1d140a;background:linear-gradient(180deg,var(--gold2),#b98431);box-shadow:0 6px 18px rgba(216,169,72,.25)}
.go:hover{filter:brightness(1.07)}.go:disabled{filter:grayscale(.8) brightness(.6);cursor:default}
.foot{position:absolute;left:26px;right:26px;bottom:16px}
.prog{height:4px;background:#2a2019;border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.st{display:flex;margin-top:7px;color:var(--muted);font-size:12px}.st .v{margin-left:auto}
</style>
</head>
<body>
<div class="bar" id="bar"><span class="t">나만의리니지 접속기</span><button class="x" id="close" title="닫기">✕</button></div>
<div class="wrap">
  <div class="logo">
    <h1>나만의리니지</h1>
    <p>한국판 3.80 · 혼자 즐기는 서버</p>
    <div class="tips">
      <b>접속이 안 될 때</b><br>
      · 작업표시줄 Tailscale 아이콘이 <b>Connected</b> 인지 확인<br>
      · 서버 불이 빨간색이면 웹 매니저에서 [서버 켜기]<br>
      · 창 크기는 <b>800×600</b>이 가장 안정적입니다
    </div>
  </div>
  <div class="card">
    <div class="srv"><span class="dot" id="dot"></span><span class="n" id="sname">서버 정보 읽는 중</span><span class="s" id="sstat">확인 중</span></div>
    <label class="h">창 크기</label>
    <div class="sizes" id="sizes">
      <button data-m="5">800×600</button><button data-m="6">1200×900</button><button data-m="7">1600×1200</button>
    </div>
    <label class="chk"><input type="checkbox" id="win" checked> 창 모드 (전체화면은 Windows 11에서 문제가 생길 수 있어요)</label>
    <button class="go" id="go">게임 시작</button>
  </div>
</div>
<div class="foot">
  <div class="prog"><i id="pg"></i></div>
  <div class="st"><span id="status">준비 중…</span><span class="v" id="ver"></span></div>
</div>
<script>
(function(){
  var post=function(o){try{window.chrome.webview.postMessage(JSON.stringify(o))}catch(e){try{window.ipc.postMessage(JSON.stringify(o))}catch(_){}}};
  var servers=[],online=null,mode=5,locked=false;
  var $=function(id){return document.getElementById(id)};
  function paintSizes(){[].forEach.call($('sizes').children,function(b){b.classList.toggle('on',+b.dataset.m===mode)})}
  function save(){post({type:'saveprefs',windowed:$('win').checked,windowMode:mode})}
  [].forEach.call($('sizes').children,function(b){b.onclick=function(){mode=+b.dataset.m;paintSizes();save()}});
  $('win').onchange=save;
  $('bar').onmousedown=function(e){if(e.target.id!=='close')post({type:'drag'})};
  $('close').onclick=function(){post({type:'cancel'})};
  $('go').onclick=function(){
    if(locked||!servers.length)return;
    if(online===false&&!confirm('서버가 응답하지 않습니다. 그래도 시작할까요?'))return;
    $('status').textContent='게임을 실행하는 중… 잠시 기다려 주세요';
    post({type:'launch',serverIdx:0,windowed:$('win').checked,windowMode:mode});
  };
  window.lineage={
    setServers:function(list){servers=list||[];if(servers.length){$('sname').textContent=servers[0].name}else{$('sname').textContent='서버 목록 없음';$('status').textContent='list.txt 파일을 확인하세요'}},
    setServerStatus:function(i,on){if(i!==0)return;online=on;$('dot').className='dot '+(on?'on':'off');$('sstat').textContent=on?'접속 가능':'응답 없음';if(!locked)$('status').textContent=on?'준비 완료 — [게임 시작]을 누르세요':'서버에 연결할 수 없습니다'},
    setVersion:function(v){$('ver').textContent='v'+v},
    setPrefs:function(p){if(p){$('win').checked=!!p.windowed;if(p.windowMode>=5&&p.windowMode<=7)mode=p.windowMode;paintSizes()}},
    setProgress:function(c,t){$('pg').style.width=(t||c||0)+'%'},
    setLocked:function(l){locked=!!l;$('go').disabled=locked;$('go').textContent=locked?'실행 중…':'게임 시작'},
    setStatus:function(s){$('status').textContent=s},
    setAnnouncement:function(){},setLinks:function(){}
  };
  paintSizes();
  post({type:'ready'});
})();
</script>
</body>
</html>
